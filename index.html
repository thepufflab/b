<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泡芙 · 升级中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f8;--dot:#ffd3e1;--ink:#5a4468;--soft:#8d7a9b;--card:#ffffff;--line:#ffc2d6;--shadow:#f3b6cb;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a2035;--dot:#3d304b;--ink:#ffe9f1;--soft:#c3afd0;--card:#372b45;--line:#5b4670;--shadow:#1d1626;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#2a2035;--dot:#3d304b;--ink:#ffe9f1;--soft:#c3afd0;--card:#372b45;--line:#5b4670;--shadow:#1d1626;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 28%,transparent 30%);background-size:26px 26px;
  color:var(--ink);font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow-x:hidden}
main{position:relative;z-index:1;width:min(92vw,400px);margin:24px auto;padding:26px 18px 22px;text-align:center;
  background:var(--card);border:3px dashed var(--line);border-radius:36px;box-shadow:0 10px 0 var(--shadow)}
h1{font-size:clamp(26px,7vw,32px);margin:18px 0 6px;letter-spacing:2px;font-weight:400}
.sub{margin:0 auto;max-width:22em;font-size:clamp(15px,4vw,16px);line-height:1.7;color:var(--soft)}

/* puff made of beads */
.stage{position:relative;height:clamp(160px,46vw,190px);display:flex;align-items:flex-end;justify-content:center}
#puff{display:grid;grid-template-columns:repeat(14,var(--s));--s:clamp(13px,3.8vw,16px);gap:1px;cursor:pointer;
  animation:bob 2.2s ease-in-out infinite;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent;
  margin-bottom:14px}
#puff.hop{animation:hop .7s ease-out}
.b{width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle,transparent 0 20%,var(--c) 23%);
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.08),inset 2px 2px 0 rgba(255,255,255,.35)}
.e{width:var(--s);height:var(--s)}
.shadow{position:absolute;bottom:0;left:50%;width:62%;height:12px;margin-left:-31%;border-radius:50%;background:var(--shadow);opacity:.8;animation:sh 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1.03,.96)}50%{transform:translateY(-14px) scale(.98,1.03)}}
@keyframes sh{0%,100%{transform:scale(1)}50%{transform:scale(.8);opacity:.5}}
@keyframes hop{0%{transform:scale(1,1)}25%{transform:translateY(-46px) rotate(-8deg) scale(.95,1.08)}55%{transform:translateY(0) rotate(5deg) scale(1.1,.88)}100%{transform:none}}

/* wrench */
.wrench{position:absolute;right:calc(50% - clamp(100px,27vw,118px));bottom:30px;font-size:clamp(24px,6vw,30px);transform-origin:20% 80%;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg)}}

/* progress beads */
.bar{display:flex;justify-content:center;gap:6px;margin:22px 0 6px;flex-wrap:wrap}
.bar i{width:clamp(14px,4vw,17px);height:clamp(14px,4vw,17px);border-radius:50%;background:radial-gradient(circle,transparent 0 20%,var(--line) 23%);transition:transform .25s}
.bar i.on{background:radial-gradient(circle,transparent 0 20%,var(--c) 23%);transform:scale(1.18)}
.msg{min-height:1.8em;margin:4px 0 14px;font-size:clamp(15px,4vw,17px);color:var(--soft)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.chips span{padding:7px 14px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-size:clamp(14px,3.8vw,16px)}

/* falling beads */
.fall{position:fixed;top:-30px;width:14px;height:14px;border-radius:50%;z-index:0;opacity:.85;
  background:radial-gradient(circle,transparent 0 20%,var(--c) 23%);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(calc(100vh + 60px)) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .fall{display:none}
}
</style>
</head>
<body>
<main>
  <div class="stage">
    <div class="shadow"></div>
    <div id="puff" role="img" aria-label="戴着安全帽的拼豆小泡芙，点一点它会跳起来"></div>
    <div class="wrench" aria-hidden="true">🔧</div>
  </div>
  <h1>泡芙</h1>
  <p class="sub">正在装修升级，泡芙在认真拧螺丝～<br>马上回来，请稍等一下下！</p>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <p class="msg" id="msg" aria-live="polite">戳一戳小泡芙试试？</p>
  <div class="chips"><span>🧮 价格计算器升级中</span><span>📦 订单整理中</span></div>
</main>

<script>
(function(){
  var MAP=[
    "......gg......",
    "....gggggg....",
    "..gggggggggg..",
    ".oppsppppppo..",
    ".opppppppppo..",
    "oppkppppppkppo",
    "opcpppmmpppcpo",
    "oppppppppppppo",
    "owwwwwwwwwwwwo",
    ".oppppppppppo.",
    "..oooooooooo.."
  ];
  var COL={o:"#9b6a54",p:"#ffd98a",s:"#fff3c9",k:"#4a3552",c:"#ff9bb3",m:"#d9607f",w:"#fffaf0",g:"#6fd1a8"};
  var puff=document.getElementById("puff"),eyes=[];
  MAP.forEach(function(row){
    row.split("").forEach(function(ch){
      var d=document.createElement("div");
      if(ch==="."){d.className="e"}
      else{d.className="b";d.style.setProperty("--c",COL[ch]);if(ch==="k")eyes.push(d)}
      puff.appendChild(d);
    });
  });

  // blink
  setInterval(function(){
    eyes.forEach(function(e){e.style.setProperty("--c",COL.p)});
    setTimeout(function(){eyes.forEach(function(e){e.style.setProperty("--c",COL.k)})},160);
  },3200);

  // click hop + messages
  var lines=["哎呀，别戳啦，痒～","泡芙在努力干活中！","新的价格表正在烤制～","螺丝快拧好了！","谢谢你的耐心等待 ♡","要不要先想想做什么图案？"];
  var msg=document.getElementById("msg"),n=0;
  function hop(){
    puff.classList.remove("hop");void puff.offsetWidth;puff.classList.add("hop");
    msg.textContent=lines[n++%lines.length];
  }
  puff.addEventListener("click",hop);
  puff.addEventListener("animationend",function(e){if(e.animationName==="hop")puff.classList.remove("hop")});

  // progress beads
  var PAL=["#ff9bb3","#ffb48a","#ffd98a","#b7e08a","#6fd1a8","#7fd0e8","#8fb4ff","#b69cff","#e59cf0","#ff9bb3"];
  var bar=document.getElementById("bar"),dots=[];
  PAL.forEach(function(c){var i=document.createElement("i");i.style.setProperty("--c",c);bar.appendChild(i);dots.push(i)});
  var k=0;
  setInterval(function(){
    if(k>dots.length){dots.forEach(function(d){d.classList.remove("on")});k=0;return}
    if(k<dots.length)dots[k].classList.add("on");
    k++;
  },480);

  // falling beads
  for(var j=0;j<14;j++){
    var f=document.createElement("div");f.className="fall";
    f.style.setProperty("--c",PAL[j%PAL.length]);
    f.style.left=(Math.random()*96)+"vw";
    f.style.animationDuration=(7+Math.random()*7)+"s";
    f.style.animationDelay=(-Math.random()*12)+"s";
    var sz=10+Math.random()*10;f.style.width=f.style.height=sz+"px";
    document.body.appendChild(f);
  }
})();
</script>
</body>
</html>
