<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="烫法转盘" />
    <meta name="theme-color" content="#ffeef2" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <title>泡芙的烫法转盘</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
    />

    <style>
      :root {
        --bg: #ffeef2;
        --peg: #ffd6e1;
        --ink: #6b3b45;
        --sub: #b07784;
        --card: #fffaf6;
        --line: #ffb8cb;
        --accent: #ff7f9f;
        --shadow: #f2a9bd;

        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }

      .hint-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: -10px 0 18px;
      }

      .hint-row .hint {
        margin: 0 !important;
        line-height: 1;
      }
      .hint-row .snd {
        margin: 0 !important;
        align-self: center;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
        background-color: var(--bg);
        background-image: radial-gradient(
          circle,
          var(--peg) 6px,
          transparent 7px
        );
        background-size: 34px 34px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 16px 44px;
      }

      .title {
        margin: 6px 0 0;
        font-weight: 400;
        font-size: clamp(30px, 8vw, 42px);
        letter-spacing: 0.08em;
        text-align: center;
        text-shadow:
          0 3px 0 var(--card),
          0 0 12px var(--card),
          0 0 2px var(--card);
      }

      .sub {
        margin: 6px 0 26px;
        padding: 5px 16px;
        border-radius: 999px;
        background: var(--card);
        border: 2px dashed var(--line);
        color: var(--sub);
        font-size: 15px;
        text-align: center;
      }

      .links {
        width: min(92vw, 440px);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 20px;
      }

      .lk {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-decoration: none;
        font-size: 16px;
        padding: 9px 8px;
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        border: 3px solid var(--accent);
        box-shadow: 0 4px 0 var(--shadow);
        text-align: center;
      }

      .lk:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--shadow);
      }
      .lk[aria-disabled="true"] {
        border-style: dashed;
        opacity: 0.65;
      }
      .lk:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .lknote {
        width: min(92vw, 440px);
        margin: -14px 0 16px;
        color: var(--sub);
        font-size: 14px;
        text-align: center;
        min-height: 0;
      }

      /* ===== Roulette ===== */

      .stage {
        position: relative;
        width: min(88vw, 440px);
        aspect-ratio: 1;
        margin-top: 10px;
      }

      .stage canvas {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
        filter: drop-shadow(0 8px 0 var(--shadow));
        transition: transform 5s cubic-bezier(0.12, 0.62, 0.08, 1);
      }

      .pointer {
        position: absolute;
        left: 50%;
        top: -20px;
        width: 46px;
        transform: translateX(-50%);
        transform-origin: 50% 0;
        transition: transform 0.08s;
        z-index: 3;
        filter: drop-shadow(0 3px 0 var(--shadow));
      }

      .pointer.tick {
        transform: translateX(-50%) rotate(-16deg);
      }

      /* ===== Character button ===== */

      .hub {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 29%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 6px solid #fff;
        background: var(--card);
        padding: 0;
        cursor: pointer;
        z-index: 3;
        box-shadow: 0 5px 0 var(--shadow);
        transition: transform 0.12s;
        overflow: visible;
      }

      .hub:hover:not(:disabled) {
        transform: translate(-50%, -50%) scale(1.05);
      }
      .hub:active:not(:disabled) {
        transform: translate(-50%, -46%) scale(0.96);
      }
      .hub:disabled {
        cursor: wait;
      }
      .hub:focus-visible {
        outline: 4px solid var(--accent);
        outline-offset: 3px;
      }

      /* ===== Animated cream puff SVG ===== */

      .puff-svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }

      .puff-body {
        transform-box: fill-box;
        transform-origin: center;
        animation: puff-float 2.5s ease-in-out infinite;
      }

      @keyframes puff-float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-3px) rotate(1deg);
        }
      }

      .puff-eye {
        transform-box: fill-box;
        transform-origin: center;
        animation: puff-blink 4s infinite;
      }

      .eye-right {
        animation-delay: 0s;
      }

      @keyframes puff-blink {
        0%,
        45%,
        48%,
        100% {
          transform: scaleY(1);
        }
        46%,
        47% {
          transform: scaleY(0.08);
        }
      }

      .mouth-open {
        display: none;
      }
      .spinning .mouth-open {
        display: block;
      }
      .spinning .mouth-smile {
        display: none;
      }
      .spinning .puff-body {
        animation: puff-excited 0.38s ease-in-out infinite;
      }

      @keyframes puff-excited {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-7px) rotate(2deg);
        }
      }

      .spinning .puff-svg {
        animation: puff-squash 0.65s ease-in-out infinite;
      }

      @keyframes puff-squash {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.97, 1.03);
        }
      }

      /* Tap label */

      .tap {
        position: absolute;
        left: 50%;
        bottom: -14px;
        transform: translateX(-50%);
        padding: 2px 12px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        border: 3px solid #fff;
        font-size: 15px;
        white-space: nowrap;
        box-shadow: 0 3px 0 var(--shadow);
        animation: bob 1.1s ease-in-out infinite;
        pointer-events: none;
      }

      .tap:before {
        content: "";
        position: absolute;
        left: 50%;
        top: -9px;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top: 0;
        border-bottom: 7px solid var(--accent);
      }

      @keyframes bob {
        0%,
        100% {
          transform: translate(-50%, 0);
        }
        50% {
          transform: translate(-50%, -5px);
        }
      }

      .spinning .tap {
        display: none;
      }

      /* ===== Hint ===== */

      .hint {
        margin: 18px 0 0;
        color: var(--sub);
        font-size: 15px;
      }

      /* ===== Result ===== */

      .result {
        position: relative;
        margin: 20px 0 0;
        width: min(92vw, 440px);
        padding: 18px 16px 20px;
        background: var(--card);
        border: 3px dashed var(--accent);
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 6px 0 var(--shadow);
      }

      .result:before,
      .result:after {
        content: "";
        position: absolute;
        top: -9px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--accent);
        border: 3px solid var(--card);
      }

      .result:before {
        left: 22px;
      }
      .result:after {
        right: 22px;
      }

      .result .label {
        color: var(--sub);
        font-size: 15px;
      }

      .result .name {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 22px;
        border-radius: 18px;
        font-size: clamp(36px, 10vw, 45px);
        letter-spacing: 0.1em;
        line-height: 1.3;
        background: var(--hl, transparent);
        color: #6b3b45;
      }

      .result.pop .name {
        animation: pop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1);
      }

      @keyframes pop {
        0% {
          transform: scale(0.5) rotate(-6deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }

      /* ===== Records ===== */

      .records {
        width: min(92vw, 440px);
        margin-top: 22px;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 22px;
        padding: 14px 16px;
        display: none;
      }

      .records h2 {
        font-size: 16px;
        font-weight: 400;
        margin: 0 0 10px;
        color: var(--sub);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .records button {
        font: inherit;
        font-size: 14px;
        background: none;
        border: none;
        color: var(--sub);
        text-decoration: underline;
        cursor: pointer;
        padding: 2px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 32px;
      }

      .chip {
        padding: 4px 13px;
        border-radius: 999px;
        color: #6b3b45;
        font-size: 15px;
        border: 2px solid #fff;
      }

      .empty {
        color: var(--sub);
        font-size: 14px;
      }

      /* ===== Sound button ===== */

      .snd {
        margin-top: 10px;
        font: inherit;
        font-size: 14px;
        padding: 4px 14px;
        border-radius: 999px;
        background: var(--card);
        color: var(--sub);
        border: 2px solid var(--line);
        cursor: pointer;
      }

      .snd:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      /* ===== Water reminder: buttons ===== */

      .wrow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        flex-basis: 100%;
      }

      .hint-row .wrow .snd {
        margin: 0 !important;
      }

      .snd.wof {
        opacity: 0.6;
      }

      .snd.wnotif {
        background: var(--accent);
        color: #fff;
        border-color: #fff;
        box-shadow: 0 3px 0 var(--shadow);
      }

      /* ===== Water reminder: popup ===== */

      .drink {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 16px
          calc(16px + env(safe-area-inset-bottom, 0px));
        background: rgba(107, 59, 69, 0.38);
      }

      .drink.show {
        display: flex;
      }

      .drink-card {
        position: relative;
        width: min(88vw, 340px);
        padding: 26px 20px 22px;
        background: var(--card);
        border: 3px dashed var(--accent);
        border-radius: 28px;
        box-shadow: 0 8px 0 var(--shadow);
        text-align: center;
        animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1);
      }

      .drink-puff {
        width: 120px;
        height: 120px;
        margin: 0 auto 6px;
      }

      .drink-title {
        margin: 0;
        font-weight: 400;
        font-size: 30px;
        letter-spacing: 0.08em;
      }

      .drink-msg {
        margin: 8px 0 18px;
        color: var(--sub);
        font-size: 16px;
      }

      .drink-ok {
        display: block;
        width: 100%;
        font: inherit;
        font-size: 22px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        border: 3px solid #fff;
        box-shadow: 0 4px 0 var(--shadow);
        cursor: pointer;
      }

      .drink-ok:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--shadow);
      }

      .drink-later {
        margin-top: 12px;
        font: inherit;
        font-size: 14px;
        background: none;
        border: none;
        color: var(--sub);
        text-decoration: underline;
        cursor: pointer;
        padding: 4px;
      }

      .drink-ok:focus-visible,
      .drink-later:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      /* ===== Confetti ===== */

      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9;
      }

      /* ===== Landscape layout ===== */

      @media (min-width: 800px) and (orientation: landscape) {
        body {
          display: grid;
          grid-template-columns: minmax(340px, 460px) auto;
          grid-template-rows: 1fr auto auto auto auto auto auto auto 1fr;
          justify-content: start;
          column-gap: clamp(32px, 5vw, 72px);
          align-items: start;
          padding: 24px 32px 28px;
          overflow-x: hidden;
        }

        .title {
          grid-area: 2 / 1;
          margin: 0;
          text-align: left;
          font-size: clamp(34px, 4.2vw, 46px);
        }

        .sub {
          grid-area: 3 / 1;
          margin: 10px 0 14px;
          justify-self: start;
        }

        .hint-row {
          grid-area: 4 / 1;
          justify-self: start;
          margin: 0 0 16px;
        }
        .hint-row .hint {
          font-size: 16px;
        }
        .hint-row .snd {
          font-size: 15px;
          padding: 6px 16px;
        }

        .links {
          grid-area: 5 / 1;
          width: 100%;
          margin: 0 0 16px;
        }
        .lk {
          padding: 12px 8px;
          font-size: 18px;
        }

        .lknote {
          grid-area: 6 / 1;
          width: 100%;
          margin: 0;
          text-align: left;
        }

        .result {
          grid-area: 7 / 1;
          width: 100%;
          margin: 14px 0 0;
        }

        .records {
          grid-area: 8 / 1;
          width: 100%;
          margin-top: 20px;
          align-self: start;
        }

        .stage {
          position: fixed;
          right: clamp(16px, 4vw, 60px);
          top: 50%;
          transform: translateY(-50%);
          margin: 0;
          width: min(calc(100dvh - 130px), 56vw, 680px);
          z-index: 0;
        }

        .tap {
          font-size: 17px;
          bottom: -16px;
        }
        .pointer {
          width: 54px;
          top: -24px;
        }

        .title,
        .sub,
        .hint-row,
        .links,
        .lknote,
        .result,
        .records {
          position: relative;
          z-index: 2;
        }
      }

      /* ===== Short landscape screens ===== */

      @media (min-width: 800px) and (orientation: landscape) and (max-height: 800px) {
        body {
          padding-top: 14px;
          padding-bottom: 14px;
        }
        .sub {
          margin: 6px 0 12px;
        }
        .hint-row {
          margin-bottom: 12px;
        }
        .result {
          padding: 12px 16px 14px;
        }
        .records {
          margin-top: 14px;
          padding: 12px 14px;
        }
        .stage {
          width: min(calc(100dvh - 110px), 56vw, 680px);
        }
      }

      /* ===== Hide navigation links ===== */

      .lk {
        display: none;
      }

      /* ===== Reduced motion ===== */

      @media (prefers-reduced-motion: reduce) {
        .tap {
          animation: none;
        }
        .stage canvas {
          transition-duration: 0.01s;
        }
        .result.pop .name {
          animation: none;
        }
        .drink-card {
          animation: none;
        }
        .puff-body,
        .puff-eye,
        .spinning .puff-svg {
          animation: none !important;
        }
      }
    </style>

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="829ed850-0010-42b0-bd16-2cbb7e170651"
    ></script>
  </head>

  <body>
    <h1 class="title">泡芙的转盘</h1>

    <p class="sub">今天烫哪一种呀？交给转盘决定～</p>

    <div class="hint-row">
      <p class="hint">点一点泡芙就开转</p>

      <button class="snd" id="snd" type="button" aria-pressed="true">
        声音：开
      </button>

      <!-- ===== Water reminder controls ===== -->
      <button class="snd" id="wToggle" type="button" aria-pressed="true">
        💧
      </button>
      <button class="snd wnotif" id="wNotif" type="button" hidden>🔔</button>
    </div>
    <nav class="links" aria-label="其他网站">
      <a
        class="lk"
        id="lkCalc"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        >🧮 计算器</a
      >
      <a
        class="lk"
        id="lkGame"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        >🎮 游戏</a
      >
    </nav>

    <p class="lknote" id="lkMsg" aria-live="polite"></p>

    <!-- ===== Roulette stage ===== -->

    <div class="stage" id="stage">
      <svg class="pointer" id="pointer" viewBox="0 0 40 40" aria-hidden="true">
        <path
          d="M20 37C4 24 2 14 8 8c5-5 11-2 12 3 1-5 7-8 12-3 6 6 4 16-12 29z"
          fill="#ff7f9f"
          stroke="#fff"
          stroke-width="3"
          stroke-linejoin="round"
        />
      </svg>

      <canvas
        id="wheel"
        width="960"
        height="960"
        aria-label="烫法转盘"
      ></canvas>

      <!-- ===== Animated cream puff character ===== -->

      <button class="hub" id="spin" type="button" aria-label="开转">
        <svg class="puff-svg" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="puffBread" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#ffe6a5" />
              <stop offset="55%" stop-color="#ffc36e" />
              <stop offset="100%" stop-color="#e99549" />
            </linearGradient>

            <linearGradient id="puffCream" x1="0" y1="0" x2="0.8" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="65%" stop-color="#fffaf0" />
              <stop offset="100%" stop-color="#f4e5c9" />
            </linearGradient>

            <linearGradient id="puffCreamTop" x1="0" y1="0" x2="0.8" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#fff0d9" />
            </linearGradient>

            <filter
              id="puffShadow"
              x="-20%"
              y="-20%"
              width="140%"
              height="150%"
            >
              <feGaussianBlur stdDeviation="2.5" />
            </filter>
          </defs>

          <!-- Ground shadow -->
          <ellipse
            cx="100"
            cy="177"
            rx="61"
            ry="8"
            fill="#a96c70"
            opacity=".18"
            filter="url(#puffShadow)"
          />

          <g class="puff-body">
            <!-- Golden pastry body -->
            <path
              d="M35 130 C24 119 29 99 43 94 C44 76 61 69 78 75 C91 64 111 66 122 76 C145 69 162 84 159 101 C176 113 170 135 157 141 C157 158 141 165 125 161 C108 173 88 169 77 162 C56 171 36 156 35 130Z"
              fill="url(#puffBread)"
              stroke="#e99a52"
              stroke-width="2.5"
              stroke-linejoin="round"
            />

            <!-- Bread highlights -->
            <path
              d="M43 116 C48 99 61 94 74 98 M116 94 C131 87 148 99 149 112"
              fill="none"
              stroke="#fff0bf"
              stroke-width="5"
              stroke-linecap="round"
              opacity=".7"
            />

            <!-- Bottom pastry shading -->
            <path
              d="M40 143 C58 159 78 153 91 158 C113 166 140 157 155 141"
              fill="none"
              stroke="#d98745"
              stroke-width="4"
              stroke-linecap="round"
              opacity=".45"
            />

            <!-- Whipped cream lower layer -->
            <path
              d="M30 119 C22 107 32 96 43 94 C35 82 46 70 60 72 C60 57 76 51 89 57 C97 43 118 44 127 58 C143 56 155 68 151 82 C166 88 166 104 154 112 C162 126 148 137 135 132 C123 146 105 139 97 134 C82 145 66 137 60 130 C45 137 34 131 30 119Z"
              fill="url(#puffCream)"
              stroke="#f1c99a"
              stroke-width="2.2"
              stroke-linejoin="round"
            />

            <!-- Cream highlights -->
            <path
              d="M43 100 C44 88 52 81 62 82 M64 70 C67 59 81 57 91 64 M105 56 C119 52 132 61 134 72"
              fill="none"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linecap="round"
              opacity=".95"
            />

            <!-- Cream swirl lower -->
            <path
              d="M45 91 C39 75 54 62 70 65 C72 48 91 39 107 47 C124 40 143 54 140 70 C153 77 150 92 138 98 C124 110 105 106 96 98 C82 111 58 109 45 91Z"
              fill="url(#puffCreamTop)"
              stroke="#f3d9b5"
              stroke-width="2"
              stroke-linejoin="round"
            />

            <!-- Upper cream spiral -->
            <path
              d="M60 72 C52 58 64 43 80 44 C84 28 104 23 119 32 C134 40 133 57 121 66 C113 78 91 82 78 73"
              fill="url(#puffCream)"
              stroke="#f2dfc6"
              stroke-width="2"
              stroke-linejoin="round"
            />

            <!-- Cream top curl -->
            <path
              d="M80 47 C77 32 88 20 101 21 C116 19 125 31 119 43 C115 55 96 59 87 49 C80 43 87 33 96 33 C103 32 107 38 104 43"
              fill="url(#puffCreamTop)"
              stroke="#f0d7b5"
              stroke-width="2"
              stroke-linejoin="round"
            />

            <!-- Cream shine -->
            <path
              d="M88 29 C91 23 100 23 105 27"
              fill="none"
              stroke="#ffffff"

            <!-- Face -->
            <g class="puff-face">

              </g>

              <!-- Blush -->
              <ellipse
                cx="54"

              <ellipse

                opacity=".65"

              <!-- Normal smile -->
              <path
                class="mouth-smile"
                d="M91 120 Q100 129 109 120"

                stroke-width="3"
                stroke-linecap="round"
              />

              <!-- Open mouth while spinning -->
              <ellipse
                class="mouth-open"
                cx="100"
                cy="123"
                rx="5"
                ry="7"
                fill="#66363b"

        </svg>

        <span class="tap">点我</span>

    </div>

    <!-- ===== Result ===== -->

    <div class="result" id="result" aria-live="polite">
      <div class="label">这次就用</div>
      <div class="name" id="name">？</div>
    </div>

    <!-- ===== History ===== -->

    <div class="records">
      <h2>
        转过的结果
        <button id="clear" type="button">清空</button>
      </h2>
      <div class="chips" id="chips">
        <span class="empty">还没有记录哦</span>
      </div>
    </div>

    <canvas id="fx"></canvas>

    <!-- ===== Water reminder popup ===== -->

    <div
      class="drink"
      id="drink"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drinkTitle"
    >
      <div class="drink-card">
        <div class="drink-puff" id="drinkPuff"></div>
        <h2 class="drink-title" id="drinkTitle">💧 喝水啦~</h2>
        <p class="drink-msg">该喝一杯水了，休息一下吧</p>
        <button class="drink-ok" id="drinkOk" type="button">喝水了</button>
        <button class="drink-later" id="drinkLater" type="button">
          稍后再说
        </button>
      </div>
    </div>

    <script>
      /* ===== Roulette options ===== */

      var ITEMS = [
        "澡巾闪",
        "金沙糖",
        "藤蔓",
        "透明玻璃闪",
        "雪璃玻璃粗闪",
        "仙度瑞拉波浪闪",
        "澡巾",
        "仲夏夜之梦粗闪",
        "英仙座细闪",
        "普通毛巾",
      ];

      var COLORS = [
        "#f9d5f0",
        "#ffd9c0",
        "#c8f0d8",
        "#c6e6ff",
        "#fff2a8",
        "#d9d2ff",
        "#ffcf9e",
        "#ffc2d1",
        "#b8f0f0",
        "#e6f5a8",
      ];

      /*
      Winning probabilities:
      First 8 options: 12.25% each
      英仙座细闪: 1%
      普通毛巾: 1%
      Total: 100%
    */

      var WEIGHTS = [
        12.25, 12.25, 12.25, 12.25, 12.25, 12.25, 12.25, 12.25, 1, 1,
      ];

      var N = ITEMS.length;
      var A = 360 / N;

      /* ===== Weighted random ===== */

      function weightedRandom() {
        var total = WEIGHTS.reduce(function (sum, weight) {
          return sum + weight;
        }, 0);

        var random = Math.random() * total;

        for (var i = 0; i < N; i++) {
          random -= WEIGHTS[i];
          if (random < 0) {
            return i;
          }
        }

        return N - 1;
      }

      /* ===== Elements ===== */

      var cv = document.getElementById("wheel");
      var ctx = cv.getContext("2d");

      var btn = document.getElementById("spin");
      var nameEl = document.getElementById("name");
      var resEl = document.getElementById("result");

      var chips = document.getElementById("chips");
      var stage = document.getElementById("stage");
      var pointer = document.getElementById("pointer");

      var KEY = "puff-roulette-records";

      /* ===== History storage ===== */

      function loadRecords() {
        try {
          var v = JSON.parse(localStorage.getItem(KEY) || "[]");
          if (!Array.isArray(v)) return [];
          return v
            .filter(function (i) {
              return Number.isInteger(i) && i >= 0 && i < N;
            })
            .slice(0, 12);
        } catch (e) {
          return [];
        }
      }

      function saveRecords() {
        try {
          localStorage.setItem(KEY, JSON.stringify(records));
        } catch (e) {}
      }

      var rot = 0;
      var spinning = false;
      var records = loadRecords();

      var reduce =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ===== Draw roulette ===== */

      function draw() {
        var S = cv.width;
        var c = S / 2;
        var R = c - 4;
        var R2 = R - 38;

        ctx.clearRect(0, 0, S, S);

        /* Outer circle */

        ctx.beginPath();
        ctx.arc(c, c, R, 0, Math.PI * 2);
        ctx.fillStyle = "#ff8fab";
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#fff";
        ctx.stroke();

        /* Decorative dots */

        for (var i = 0; i < 24; i++) {
          var t = (i / 24) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(
            c + Math.cos(t) * (R - 19),
            c + Math.sin(t) * (R - 19),
            7,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = i % 2 ? "#fff" : "#ffe29a";
          ctx.fill();
        }

        /* Roulette sections */

        for (var i = 0; i < N; i++) {
          var a0 = ((i * A - 90) * Math.PI) / 180;
          var a1 = (((i + 1) * A - 90) * Math.PI) / 180;

          ctx.beginPath();
          ctx.moveTo(c, c);
          ctx.arc(c, c, R2, a0, a1);
          ctx.closePath();

          ctx.fillStyle = COLORS[i];
          ctx.fill();

          ctx.lineWidth = 5;
          ctx.strokeStyle = "#fff";
          ctx.stroke();

          /* Text */

          ctx.save();

          ctx.translate(c, c);
          ctx.rotate((a0 + a1) / 2);

          ctx.fillStyle = "#6b3b45";
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";

          ctx.font =
            '400 39px "ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

          ctx.fillText(ITEMS[i], R2 - 30, 0);

          /* Decorative dots */

          ctx.fillStyle = "rgba(255,255,255,.85)";

          ctx.beginPath();
          ctx.arc(R2 - 14, -46, 5, 0, 7);
          ctx.arc(R2 - 14, 46, 5, 0, 7);
          ctx.fill();

          ctx.restore();
        }

        /* Inner border */

        ctx.beginPath();
        ctx.arc(c, c, R2, 0, Math.PI * 2);
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
      }

      /* ===== Render history ===== */

      function render() {
        if (!records.length) {
          chips.innerHTML = '<span class="empty">还没有记录哦</span>';
          return;
        }

        chips.innerHTML = "";

        records.forEach(function (i) {
          var s = document.createElement("span");
          s.className = "chip";
          s.textContent = ITEMS[i];
          s.style.background = COLORS[i];
          chips.appendChild(s);
        });
      }

      /* ===== Pointer ticking ===== */

      var lastIdx = -1;

      function tickLoop() {
        if (!spinning) return;

        var m = new DOMMatrix(getComputedStyle(cv).transform);
        var ang = (Math.atan2(m.b, m.a) * 180) / Math.PI;
        var k = Math.floor((((-ang % 360) + 360) % 360) / A);

        if (k !== lastIdx) {
          lastIdx = k;
          playTick();
          pointer.classList.add("tick");

          setTimeout(function () {
            pointer.classList.remove("tick");
          }, 80);
        }

        requestAnimationFrame(tickLoop);
      }

      /* ===== Confetti ===== */

      function confetti() {
        if (reduce) return;

        var fx = document.getElementById("fx");
        var x = fx.getContext("2d");

        fx.width = innerWidth;
        fx.height = innerHeight;

        var b = stage.getBoundingClientRect();
        var ps = [];

        for (var j = 0; j < 90; j++) {
          ps.push({
            x: b.left + b.width / 2,
            y: b.top + b.height * 0.35,
            vx: (Math.random() - 0.5) * 14,
            vy: -4 - Math.random() * 11,
            s: 6 + Math.random() * 7,
            r: Math.random() * 6,
            vr: (Math.random() - 0.5) * 0.4,
            c: COLORS[j % N],
            round: j % 3 === 0,
          });
        }

        var f = 0;

        (function go() {
          x.clearRect(0, 0, fx.width, fx.height);

          ps.forEach(function (p) {
            p.vy += 0.35;
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.99;
            p.r += p.vr;

            x.save();
            x.translate(p.x, p.y);
            x.rotate(p.r);
            x.globalAlpha = Math.max(0, 1 - f / 120);
            x.fillStyle = p.c;

            if (p.round) {
              x.beginPath();
              x.arc(0, 0, p.s / 2, 0, 7);
              x.fill();
            } else {
              x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
            }

            x.restore();
          });

          if (++f < 120) {
            requestAnimationFrame(go);
          } else {
            x.clearRect(0, 0, fx.width, fx.height);
          }
        })();
      }

      /* ===== Sound system ===== */

      var ac = null;
      var muted = false;
      var tc = 0;
      var lastTickT = 0;

      var SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      var MEL = [0, 2, 4, 5, 4, 2, 3, 1];

      function audio() {
        if (muted) return null;

        if (!ac) {
          var C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          try {
            ac = new C();
          } catch (e) {
            return null;
          }
        }

        if (ac.state === "suspended") {
          ac.resume();
        }

        return ac;
      }

      function note(f, delay, dur, type, vol) {
        var a = audio();
        if (!a) return;

        var t = a.currentTime + delay;
        var o = a.createOscillator();
        var g = a.createGain();

        o.type = type || "sine";
        o.frequency.value = f;

        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        o.connect(g);
        g.connect(a.destination);

        o.start(t);
        o.stop(t + dur + 0.02);
      }

      function playTick() {
        var n = performance.now();
        if (n - lastTickT < 45) return;
        lastTickT = n;

        note(SCALE[MEL[tc++ % MEL.length]], 0, 0.16, "triangle", 0.13);
      }

      function playStart() {
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
          note(f, i * 0.07, 0.18, "triangle", 0.14);
        });
      }

      function playWin() {
        [783.99, 987.77, 1174.66, 1567.98].forEach(function (f, i) {
          note(f, i * 0.12, 0.35, "sine", 0.17);
        });
        note(2093, 0.52, 0.5, "sine", 0.09);
      }

      /* ===== Spin ===== */

      function spin() {
        if (spinning) return;

        spinning = true;
        btn.disabled = true;

        stage.classList.add("spinning");
        resEl.classList.remove("pop");

        nameEl.textContent = "…";
        nameEl.style.setProperty("--hl", "transparent");

        var idx = weightedRandom();
        var off = A * (0.12 + Math.random() * 0.76);
        var land = ((-(idx * A + off) % 360) + 360) % 360;

        rot = Math.ceil(rot / 360) * 360 + 360 * 6 + land;

        lastIdx = -1;

        playStart();

        cv.style.transform = "rotate(" + rot + "deg)";

        requestAnimationFrame(tickLoop);

        var done = false;

        function finish() {
          if (done) return;
          done = true;

          spinning = false;
          btn.disabled = false;

          stage.classList.remove("spinning");

          nameEl.textContent = ITEMS[idx];
          nameEl.style.setProperty("--hl", COLORS[idx]);

          void resEl.offsetWidth;

          resEl.classList.add("pop");

          records.unshift(idx);

          if (records.length > 12) {
            records.pop();
          }

          saveRecords();
          render();

          confetti();
          playWin();
        }

        cv.addEventListener("transitionend", finish, { once: true });

        setTimeout(finish, 5400);
      }

      btn.addEventListener("click", spin);

      /* ===== Sound toggle ===== */

      var sndBtn = document.getElementById("snd");

      sndBtn.addEventListener("click", function () {
        muted = !muted;

        sndBtn.textContent = muted ? "声音：关" : "声音：开";
        sndBtn.setAttribute("aria-pressed", String(!muted));

        if (!muted) {
          note(783.99, 0, 0.2, "triangle", 0.14);
        }
      });

      /* ===== Clear history ===== */

      document.getElementById("clear").addEventListener("click", function () {
        records = [];
        saveRecords();
        render();
      });

      /* ===== Initialize ===== */

      draw();
      render();

      /* Redraw when custom font loads */

      if (document.fonts && document.fonts.load) {
        document.fonts
          .load('39px "ZCOOL KuaiLe"', ITEMS.join("") + "？…")
          .then(draw)
          .catch(function () {});
      }
    </script>

    <!-- ===== Water reminder ===== -->

    <script>
      (function () {
        try {
          var K_ON = "puff-water-on";
          var K_NEXT = "puff-water-next";
          var K_MIN = "puff-water-min";
          function lsGet(k) {
            try {
              return localStorage.getItem(k);
            } catch (e) {
              return null;
            }
          }

          function lsSet(k, v) {
            try {
              localStorage.setItem(k, v);
            } catch (e) {}
          }

          var on = lsGet(K_ON) !== "0"; /* on by default */
          var mins = 60; /* 提醒间隔（分钟）想改就改这个数字 */
          var next = parseInt(lsGet(K_NEXT), 10);
          var shown = false;

          var elToggle = document.getElementById("wToggle");
          var elNotif = document.getElementById("wNotif");
          var elDrink = document.getElementById("drink");
          var elOk = document.getElementById("drinkOk");
          var elLater = document.getElementById("drinkLater");
          var elPuff = document.getElementById("drinkPuff");

          /* Copy the puff character into the popup (gradients are reused from the main one) */
          try {
            var src = document.querySelector(".hub .puff-svg");
            if (src && elPuff) {
              var copy = src.cloneNode(true);
              var defs = copy.querySelector("defs");
              if (defs) defs.parentNode.removeChild(defs);
              elPuff.appendChild(copy);
            }
          } catch (e) {}

          function schedule() {
            next = Date.now() + mins * 60000;
            lsSet(K_NEXT, String(next));
          }

          if (!(next > 0)) schedule();

          function refreshButtons() {
            elToggle.textContent = on ? "💧" : "💧";
            elToggle.setAttribute("aria-pressed", String(on));
            elToggle.classList.toggle("wof", !on);

            elNotif.hidden = !(
              on &&
              "Notification" in window &&
              Notification.permission === "default"
            );
          }

          function showPopup() {
            shown = true;
            elDrink.classList.add("show");
          }

          function hidePopup() {
            shown = false;
            elDrink.classList.remove("show");
          }

          function notify() {
            try {
              if (!("Notification" in window)) return;
              if (Notification.permission !== "granted") return;
              if (document.visibilityState === "visible") return;

              var opts = {
                body: "该喝一杯水了，休息一下吧",
                icon: "icon-192.png",
                tag: "puff-water",
                renotify: true,
              };

              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.ready
                  .then(function (reg) {
                    reg.showNotification("💧 喝水啦~", opts);
                  })
                  .catch(function () {
                    try {
                      new Notification("💧 喝水啦~", opts);
                    } catch (e) {}
                  });
              } else {
                new Notification("💧 喝水啦~", opts);
              }
            } catch (e) {}
          }

          function fire() {
            showPopup();
            notify();
            try {
              note(1046.5, 0, 0.25, "sine", 0.14);
              note(1318.5, 0.14, 0.35, "sine", 0.14);
            } catch (e) {}
          }

          function check() {
            if (!on || shown) return;
            if (Date.now() >= next) fire();
          }

          function drank() {
            hidePopup();
            schedule();
          }

          elOk.addEventListener("click", drank);
          elLater.addEventListener("click", drank);

          elToggle.addEventListener("click", function () {
            on = !on;
            lsSet(K_ON, on ? "1" : "0");
            if (on) {
              schedule();
            } else {
              hidePopup();
            }
            refreshButtons();
          });

          elNotif.addEventListener("click", function () {
            try {
              var p = Notification.requestPermission(function () {
                refreshButtons();
              });
              if (p && p.then) p.then(refreshButtons).catch(refreshButtons);
            } catch (e) {
              refreshButtons();
            }
          });

          /* Register the service worker (needed for system notifications) */
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
              navigator.serviceWorker.register("sw.js").catch(function () {});
            });
          }

          /* Check when time passes, and when coming back to the app */
          setInterval(check, 5000);

          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") check();
          });

          window.addEventListener("focus", check);
          window.addEventListener("pageshow", check);

          refreshButtons();
          check();
        } catch (e) {
          /* The water reminder must never break the roulette */
        }
      })();
    </script>

    <!-- ===== Other website links ===== -->

    <script>
      (function () {
        /* 在这里填网址就可以了，例如 calc:'https://xxx.com' */

        var LINKS = {
          calc: "https://thepufflab.github.io/b/",
          game: "https://thepufflab.github.io/b/game",
        };

        var map = {
          lkCalc: ["calc", "泡芙的计算器"],
          lkGame: ["game", "泡芙的游戏"],
        };

        Object.keys(map).forEach(function (id) {
          var a = document.getElementById(id);
          var u = LINKS[map[id][0]];

          if (!a) return;

          if (u) {
            a.href = u;
            return;
          }

          a.setAttribute("aria-disabled", "true");
          a.removeAttribute("target");

          a.addEventListener("click", function (e) {
            e.preventDefault();
            document.getElementById("lkMsg").textContent =
              map[id][1] + "的网址还没填，之后填进代码里的 LINKS 就能用了。";
          });
        });
      })();
    </script>
